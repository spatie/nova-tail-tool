name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: PHP style and Composer validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: laravel/pint:^1.0
      - run: composer validate --strict
      - run: pint --test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PHP ${{ matrix.php }} / Laravel 13 / Nova 5
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, intl, pdo_sqlite
          coverage: none
      - name: Authenticate Nova
        run: test -n "$COMPOSER_AUTH"
      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction
          composer show laravel/nova
      - run: composer test

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-format
      - run: npm run build
      - run: git diff --exit-code -- dist
